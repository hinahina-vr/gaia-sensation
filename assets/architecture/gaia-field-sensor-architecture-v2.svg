<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945" role="img" aria-labelledby="title desc">
  <title id="title">ESP32からGAIA SENSEWAREへつなぐ観測メモ</title>
  <desc id="desc">温度・湿度・PM2.5などのセンサーをESP32へつなぎ、Wi-FiとHTTPSで送信し、検証と由来を保持して世界地図と観測データへ表示する手書きの接続図。</desc>
  <defs>
    <pattern id="smallGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#4b82a0" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="largeGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#315f7a" stroke-opacity=".14" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#173b54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .hand{font-family:"Segoe Print","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#173b54}
      .sans{font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;fill:#173b54}
      .line{fill:none;stroke:#173b54;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#285d77;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .node{fill:#f5f0df;fill-opacity:.94;stroke:#173b54;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .teal{stroke:#1a827d}.coral{stroke:#c35b4d}.amber{stroke:#b77a24}
      .note{font-size:19px;font-weight:700}.mini{font-size:15px}.tech{font-size:13px;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1680" height="945" fill="#e5dfce"/>
  <rect y="108" width="1680" height="837" fill="url(#smallGrid)"/>
  <rect y="108" width="1680" height="837" fill="url(#largeGrid)"/>
  <path d="M0 108C268 111 436 104 698 109S1234 105 1680 109" fill="none" stroke="#bd5d54" stroke-opacity=".62" stroke-width="3"/>
  <path d="M0 0H1680V108C1410 102 1232 112 998 106S432 112 0 108Z" fill="#183447"/>
  <text class="hand" x="64" y="49" fill="#fff7e5" font-size="30" font-weight="700">ESP32 → GAIA SENSEWARE　接続メモ</text>
  <text class="sans" x="66" y="82" fill="#bfe4dc" font-size="14" letter-spacing=".12em">展示準備ノート / まずは一台で PoC　・　測った条件まで一緒に残す</text>
  <text class="hand" x="1610" y="68" fill="#f2c27f" font-size="17" text-anchor="end" transform="rotate(-2 1610 68)">10/3　みずの整理案</text>

  <path class="line" d="M318 313C352 305 366 312 397 309" marker-end="url(#arrow)"/>
  <path class="line" d="M625 309C661 305 677 308 708 303" marker-end="url(#arrow)"/>
  <path class="line" d="M886 303C922 298 934 304 966 301" marker-end="url(#arrow)"/>
  <path class="line" d="M1218 302C1250 296 1263 303 1290 298" marker-end="url(#arrow)"/>
  <path class="line" d="M1472 298C1500 292 1511 296 1537 291" marker-end="url(#arrow)"/>

  <g transform="translate(34 176) rotate(-.8 142 134)">
    <path class="node teal" d="M10 16Q12 4 26 6L272 0Q287 2 286 18L292 249Q290 263 274 261L17 268Q2 264 4 248Z"/>
    <text class="hand note" x="28" y="45">① センサー</text>
    <text class="sans" x="28" y="77" font-size="16">温度・湿度・PM2.5</text>
    <text class="sans" x="28" y="101" font-size="15">気圧 / 照度 / 音 など</text>
    <path class="thin teal" d="M42 205V131M42 161H61M54 205A28 28 0 1 0 30 205A28 28 0 0 0 54 205Z"/>
    <path class="thin teal" d="M107 139c-22 33-22 33-22 46a22 22 0 0 0 44 0c0-13 0-13-22-46Z"/>
    <circle cx="184" cy="168" r="7" fill="#c35b4d"/><circle cx="210" cy="153" r="5" fill="#c35b4d"/><circle cx="224" cy="183" r="9" fill="#c35b4d"/><circle cx="174" cy="199" r="5" fill="#c35b4d"/><circle cx="213" cy="211" r="6" fill="#c35b4d"/>
    <path class="thin" d="M155 126Q199 112 246 127"/>
    <text class="hand mini" x="150" y="239" transform="rotate(2 150 239)">身近な一点を測る</text>
  </g>

  <g transform="translate(402 181) rotate(.6 109 132)">
    <path class="node amber" d="M9 12Q12 2 25 4L201 0Q217 3 215 17L222 246Q217 262 202 260L17 266Q3 261 4 246Z"/>
    <text class="hand note" x="27" y="45">② ESP32</text>
    <rect x="47" y="83" width="128" height="105" rx="7" fill="#d9e5dc" stroke="#173b54" stroke-width="3"/>
    <rect x="70" y="105" width="82" height="57" rx="5" fill="#183447"/>
    <text class="sans" x="111" y="130" fill="#fff7e5" font-size="17" text-anchor="middle" font-weight="700">ESP32</text>
    <text class="sans" x="111" y="150" fill="#94d5c9" font-size="10" text-anchor="middle">EDGE NODE</text>
    <g fill="#b77a24"><circle cx="31" cy="91" r="4"/><circle cx="31" cy="116" r="4"/><circle cx="31" cy="141" r="4"/><circle cx="31" cy="166" r="4"/><circle cx="191" cy="91" r="4"/><circle cx="191" cy="116" r="4"/><circle cx="191" cy="141" r="4"/><circle cx="191" cy="166" r="4"/></g>
    <text class="hand mini" x="34" y="226">読み取り + 送信準備</text>
  </g>

  <g transform="translate(704 190)">
    <path class="node coral" d="M8 16Q10 4 24 6L158 1Q175 4 173 19L180 225Q177 242 160 240L17 246Q3 241 5 226Z"/>
    <text class="hand note" x="31" y="45">③ Wi-Fi</text>
    <path class="line coral" d="M45 104Q89 66 137 103M62 124Q89 98 121 123M79 143Q90 132 104 143"/>
    <circle cx="91" cy="157" r="6" fill="#c35b4d"/>
    <path class="thin coral" d="M31 185Q89 176 148 187"/>
    <text class="sans" x="90" y="211" font-size="16" text-anchor="middle" font-weight="700">HTTPS 送信</text>
    <text class="sans tech" x="90" y="230" text-anchor="middle">JSON / TLS</text>
  </g>

  <g transform="translate(969 171) rotate(-.4 121 145)">
    <path class="node teal" d="M8 15Q12 3 28 5L230 0Q247 4 244 21L251 268Q248 284 232 281L19 289Q3 284 5 268Z"/>
    <text class="hand note" x="27" y="48">④ GAIA SENSEWARE</text>
    <path class="thin teal" d="M48 116c3-27 26-47 55-43 14-26 56-23 67 8 31-3 50 39 25 59H53c-28-5-31-39-5-49"/>
    <path class="thin teal" d="M75 159H182M75 179H182M75 199H157"/>
    <circle cx="193" cy="199" r="7" fill="#1a827d"/>
    <text class="hand mini" x="35" y="239">受け取る / 整える</text>
    <text class="sans tech" x="35" y="263">INGEST API</text>
  </g>

  <g transform="translate(1291 178) rotate(.7 88 135)">
    <path class="node coral" d="M7 13Q10 3 22 5L164 1Q179 4 177 18L183 240Q180 256 164 253L17 260Q3 255 5 241Z"/>
    <text class="hand" x="25" y="46" font-size="18" font-weight="700">⑤ 検証</text>
    <text class="hand" x="25" y="74" font-size="18" font-weight="700">　＋由来を保持</text>
    <path class="line coral" d="M43 111l18 18 37-45"/>
    <path class="thin coral" d="M37 151H145M37 177H133M37 203H151"/>
    <text class="sans" x="39" y="232" font-size="13">時刻 / 場所 / 機器 / 条件</text>
  </g>

  <g transform="translate(1531 176)">
    <path class="node amber" d="M7 14Q10 4 22 5L137 1Q151 5 149 18L155 237Q152 252 138 250L17 256Q4 251 5 239Z"/>
    <text class="hand" x="79" y="42" font-size="17" text-anchor="middle" font-weight="700">⑥ 世界地図</text>
    <path class="thin amber" d="M31 75L72 65L110 78L137 70V174L102 183L66 172L31 184ZM72 65V172M110 78V183"/>
    <path d="M52 111c11-12 28-8 28 6-5 10-14 17-16 29-8-11-22-20-12-35Zm50 26c8-9 20-6 21 5-4 8-11 13-12 22-7-8-17-15-9-27Z" fill="#1a827d" fill-opacity=".76"/>
    <text class="sans" x="79" y="216" font-size="14" text-anchor="middle">観測データ</text>
    <text class="sans tech" x="79" y="237" text-anchor="middle">MAP / LOG</text>
  </g>

  <g transform="translate(292 458) rotate(-1 113 24)">
    <path d="M4 8Q7 2 15 3L216 0Q226 3 224 12L228 39Q225 49 215 47L11 51Q2 48 4 38Z" fill="#f4dfd6" fill-opacity=".94" stroke="#c35b4d" stroke-width="2.6" stroke-linecap="round"/>
    <path class="thin coral" d="M22 28Q39 12 58 28M30 36Q40 27 50 36"/>
    <text class="sans" x="72" y="31" font-size="16" font-weight="700">Wi-Fi → HTTPS 送信</text>
  </g>

  <g transform="translate(54 527) rotate(-1 235 104)">
    <path d="M5 14Q8 2 23 5L449 0Q465 5 461 22L468 183Q464 199 447 196L18 203Q2 198 5 181Z" fill="#f6edbc" fill-opacity=".92" stroke="#b77a24" stroke-width="3" stroke-linecap="round"/>
    <text class="hand" x="29" y="47" font-size="21" font-weight="700">送るのは値だけじゃない！</text>
    <text class="sans" x="30" y="82" font-size="17">✓ 観測した時刻　✓ おおまかな場所</text>
    <text class="sans" x="30" y="116" font-size="17">✓ センサーの種類　✓ 設置条件</text>
    <path class="thin amber" d="M30 142Q231 151 431 140"/>
    <text class="hand mini" x="30" y="176">あとで「どこから来た値か」を確かめられる</text>
  </g>

  <g transform="translate(1180 521) rotate(1 212 102)">
    <path d="M7 13Q10 3 24 5L410 1Q427 5 424 21L432 180Q428 197 411 194L19 201Q3 196 5 179Z" fill="#d9ebe2" fill-opacity=".94" stroke="#1a827d" stroke-width="3" stroke-linecap="round"/>
    <text class="hand" x="30" y="48" font-size="21" font-weight="700">通信が切れたら？</text>
    <text class="sans" x="31" y="83" font-size="17">通信断 → 参加センサー層だけ「未接続」</text>
    <text class="sans" x="31" y="117" font-size="17">再接続 → 同じ条件を保って自動再開</text>
    <path class="line teal" d="M55 158C132 143 210 171 284 152S368 153 394 145" marker-end="url(#arrow)"/>
  </g>

  <path class="thin" d="M552 553Q809 507 1109 548" stroke-dasharray="8 14"/>
  <text class="hand" x="832" y="526" font-size="18" text-anchor="middle" transform="rotate(-1 832 526)">公開データと混ぜず、別の層として重ねる</text>
  <path d="M88 785Q373 769 664 785T1231 780T1601 787" fill="none" stroke="#bd5d54" stroke-opacity=".38" stroke-width="3"/>
  <text class="hand" x="82" y="837" font-size="17">メモ: 最初の一台は失敗してもOK。条件と由来が残れば、みんなで直して次の観測へ進める。</text>
  <text class="sans" x="82" y="873" font-size="13" letter-spacing=".12em">SENSOR → ESP32 → WI-FI → HTTPS → GAIA SENSEWARE → PROVENANCE → MAP</text>
</svg>
